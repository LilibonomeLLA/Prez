<h1 id="%F0%9F%90%89-pr%C3%A9paration-%C3%A0-lentretien-rh--dsi-chez-caderas-martin"><img class="emoji" draggable="false" alt="🐉" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f409.svg" data-marp-twemoji=""/> Préparation à l’entretien RH — DSI chez Caderas Martin</h1>
<p>L’objectif de ton entretien RH sera de démontrer trois choses : ta compréhension des enjeux de l’entreprise, ta capacité à faire du système d’information un levier de performance et ta motivation à rejoindre Caderas Martin, au-delà de la seule dimension technologique.</p>
<p>Pour un poste de DSI, il faut articuler ton discours autour de la stratégie de l'entreprise, de ses métiers, de la transformation numérique, de la sécurité, de la qualité de service et de l'accompagnement des équipes.</p>
<h2 id="1-synth%C3%A8se-des-informations-cl%C3%A9s-sur-caderas-martin">1. Synthèse des informations clés sur Caderas Martin</h2>
<p><img class="emoji" draggable="false" alt="🦜" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f99c.svg" data-marp-twemoji=""/> Cabinet d’expertise comptable, d’audit et de conseil : Fondé en <strong>1978</strong>, le cabinet accompagne des entreprises françaises et internationales dans leurs problématiques comptables, financières, fiscales et sociales. Il privilégie une relation client personnalisée et une organisation transversale.</p>
<p><img class="emoji" draggable="false" alt="📃" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c3.svg" data-marp-twemoji=""/> Site officiel : <a href="https://www.caderas-martin.com/?utm_source=chatgpt.com">caderas-martin.com</a> </p>
<p><img src="img/139.png" alt="" style="width:580px;" /></p>
<p><img class="emoji" draggable="false" alt="🕐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f550.svg" data-marp-twemoji=""/> Rapport de transparence 2025 : le chiffre d’affaires publié dans ce rapport atteint 19,011 M€ HT au 31 août 2025.</p>

<h3 id="son-positionnement-et-ses-m%C3%A9tiers">Son positionnement et ses métiers</h3>
<p>Le cabinet exerce principalement trois activités complémentaires :</p>
<p><img class="emoji" draggable="false" alt="✔️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2714.svg" data-marp-twemoji=""/> Expertise comptable et conseil : tenue et révision comptables, accompagnement des dirigeants, analyse financière et conseil en gestion.</p>
<p><img class="emoji" draggable="false" alt="✔️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2714.svg" data-marp-twemoji=""/> Audit et commissariat aux comptes : fiabilisation de l’information financière et contrôle des comptes.</p>
<p><img class="emoji" draggable="false" alt="✔️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2714.svg" data-marp-twemoji=""/> Services spécialisés : paie, ressources humaines, accompagnement fiscal et social, missions de conseil spécifiques.</p>
<p>Sa clientèle comprend notamment des PME, des ETI, des filiales de groupes étrangers et des entreprises de secteurs variés.</p>
<h4 id="particularit%C3%A9-diff%C3%A9renciatrice--une-forte-dimension-internationale">Particularité différenciatrice : Une forte dimension internationale</h4>
<p><img class="emoji" draggable="false" alt="🏳️‍🌈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3f3-fe0f-200d-1f308.svg" data-marp-twemoji=""/> Plus de la moitié de la clientèle est internationale. Le cabinet possède notamment un Japan Desk, un Nordik Desk et un bureau de liaison à Tokyo. Cette dimension implique des échanges internationaux, des exigences de confidentialité et des besoins de collaboration numérique.</p>
<h4 id="une-organisation-transverse">Une organisation transverse</h4>
<p>Le cabinet adapte ses équipes aux besoins des missions plutôt que de rattacher systématiquement les collaborateurs à un associé unique. Le SI doit donc faciliter le partage des dossiers, la gestion des habilitations et la circulation de l’information entre équipes.</p>
<h4 id="une-culture-d%C3%A9j%C3%A0-orient%C3%A9e-vers-la-digitalisation">Une culture déjà orientée vers la digitalisation</h4>
<p>Utilisation de logiciels spécialisés en comptabilité, audit, consolidation, paie, planification et partage documentaire. Le cabinet propose également des outils collaboratifs et un espace client. Le poste de DSI s'inscrit donc dans un environnement numérique existant, à faire évoluer plutôt qu'à construire de zéro.</p>
<h3 id="culture-dentreprise-et-valeurs">Culture d’entreprise et valeurs</h3>
<p>Les éléments mis en avant par le cabinet sont :</p>
<ul>
<li>
<p>La <strong>qualité technique</strong> et la <strong>fiabilité</strong> des prestations.</p>
</li>
<li>
<p>La <strong>proximité avec les clients</strong> et l’<strong>implication des associés</strong>.</p>
</li>
<li>
<p>La <strong>bienveillance</strong>, l’<strong>esprit d’équipe</strong> et la <strong>transmission des connaissances</strong>.</p>
</li>
<li>
<p>L’<strong>amélioration continue</strong> et la recherche de solutions numériques utiles aux métiers.</p>
</li>
</ul>
<p>Le cabinet indique explicitement vouloir utiliser des outils performants et limiter les tâches sans valeur ajoutée. C’est un point particulièrement intéressant à exploiter pour expliquer ta vision du rôle d’un DSI.</p>
</section>

<h2 id="2-les-enjeux-strat%C3%A9giques-du-si-%C3%A0-comprendre-avant-lentretien">2. Les enjeux stratégiques du SI à comprendre avant l’entretien</h2>
<p>Il faut distinguer les faits publiés par le cabinet des hypothèses que tu pourras vérifier en entretien. Les enjeux suivants sont des pistes de réflexion pertinentes pour un DSI, pas un diagnostic de l'état actuel de son informatique.</p>
<h4 id="1-s%C3%A9curit%C3%A9-confidentialit%C3%A9-et-continuit%C3%A9-dactivit%C3%A9">1. Sécurité, confidentialité et continuité d’activité</h4>
<p>Le cabinet manipule des données comptables, financières, fiscales, sociales et des informations sensibles concernant ses clients. Les priorités sont donc la cybersécurité, les sauvegardes restaurables, la gestion des identités et des accès, la protection des postes, la réponse aux incidents et la continuité de service.</p>
<h4 id="2-modernisation-et-coh%C3%A9rence-du-portefeuille-applicatif">2. Modernisation et cohérence du portefeuille applicatif</h4>
<p>L’enjeu consiste à faire fonctionner ensemble les outils métiers, la GED, la paie, les applications collaboratives, le reporting et les solutions de dématérialisation. Il faut rechercher la simplicité d’usage, la qualité des interfaces, la maîtrise des coûts et la réduction des doubles saisies.</p>
<h4 id="3-facturation-%C3%A9lectronique-et-transformation-des-processus">3. Facturation électronique et transformation des processus</h4>
<p>C’est un sujet particulièrement concret : le cabinet communique sur la réforme et sur le choix d’une plateforme de dématérialisation partenaire. Au 19 octobre 2026, la réception des factures électroniques est obligatoire depuis le 1er septembre 2026 pour les entreprises concernées ; l’émission suit un calendrier progressif selon la taille de l’entreprise. Il faut donc vérifier où en est le cabinet dans son propre déploiement et dans l’accompagnement de ses clients.</p>
<h4 id="4-exp%C3%A9rience-utilisateur-et-adoption">4. Expérience utilisateur et adoption</h4>
<p>Dans un cabinet de cette taille, l'informatique doit être un facilitateur du quotidien : disponibilité des applications, assistance réactive, accès sécurisé aux dossiers, mobilité et accompagnement des utilisateurs. Une évolution technologique n’a de valeur que si elle améliore effectivement le travail des collaborateurs.</p>
<h4 id="5-pilotage-ma%C3%AEtrise-des-co%C3%BBts-et-innovation">5. Pilotage, maîtrise des coûts et innovation</h4>
<p>Le DSI doit arbitrer entre maintien en conditions opérationnelles, investissements, projets métiers et innovations telles que l’automatisation ou l’IA. La réussite se mesure par des résultats tangibles : moins de tâches manuelles, des délais réduits, une meilleure qualité de données et des risques mieux maîtrisés.</p>
<p>Un élément supplémentaire mérite ton attention : le site carrière affiche actuellement un poste de <strong>Directeur de la Transformation Digitale &amp; Data</strong>. Il serait utile de vérifier si le poste de DSI dont tu as été informé correspond à cette fonction, à un poste distinct ou à une évolution de l’organisation.</p>
</section>

<h2 id="3-les-%C3%A9l%C3%A9ments-de-motivation-%C3%A0-mettre-en-avant">3. Les éléments de motivation à mettre en avant</h2>
<h3 id="axe-1--rejoindre-une-entreprise-o%C3%B9-le-si-est-au-c%C5%93ur-du-m%C3%A9tier">Axe 1 — Rejoindre une entreprise où le SI est au cœur du métier</h3>
<p>Le cabinet ne vend pas un produit informatique : il vend de l’expertise, du conseil, de la fiabilité et de la confiance. Son SI contribue directement à cette promesse.</p>
<p>Ton argument : tu veux positionner l'informatique comme une fonction stratégique qui améliore le service rendu aux clients et la productivité des collaborateurs.</p>
<p>Formulation possible :</p>
<blockquote>
<p>« Ce qui m'intéresse chez Caderas Martin, c'est que le système d'information est directement lié à la qualité du service rendu aux clients. Dans un cabinet d'expertise comptable et d'audit, la disponibilité des outils, la sécurité des données et la fluidité des processus sont essentielles. Je souhaite inscrire la DSI dans cette logique : un SI fiable et sécurisé, mais également un levier de performance et de différenciation. »</p>
</blockquote>
<h3 id="axe-2--participer-%C3%A0-une-transformation-num%C3%A9rique-concr%C3%A8te">Axe 2 — Participer à une transformation numérique concrète</h3>
<p>Le cabinet a déjà engagé une démarche de digitalisation et travaille sur les évolutions de ses outils comptables et de facturation électronique.</p>
<p>Ton argument : tu es attiré par un contexte où il faut articuler les besoins métiers, les choix technologiques, la conduite du changement et les résultats opérationnels.</p>
<blockquote>
<p>« Je suis particulièrement motivé par la possibilité de faire évoluer un système d'information déjà structuré, en priorisant les projets qui apportent une valeur mesurable aux métiers. La transformation numérique doit se traduire par des processus plus simples, une meilleure circulation de l'information et davantage de temps consacré aux activités à valeur ajoutée. »</p>
</blockquote>
<h3 id="axe-3--travailler-dans-une-structure-%C3%A0-taille-humaine-et-%C3%A0-dimension-internationale">Axe 3 — Travailler dans une structure à taille humaine et à dimension internationale</h3>
<p>Caderas Martin associe une taille intermédiaire, une <strong>organisation transversale</strong> et une clientèle largement internationale. Son site met également en avant la <strong>proximité managériale et l'esprit collectif.</strong></p>
<p>Ton argument : tu peux valoriser l'intérêt d'une fonction qui travaille directement avec les associés, les équipes métiers et les partenaires technologiques, avec des décisions proches du terrain.</p>
<blockquote>
<p>« J'apprécie les environnements dans lesquels la DSI peut travailler en proximité avec les décideurs et les utilisateurs. La taille du cabinet, sa diversité de métiers et son ouverture internationale me semblent offrir un contexte intéressant pour concilier vision stratégique, pragmatisme opérationnel et accompagnement humain. »</p>
</blockquote>
<h3 id="axe-4--construire-une-informatique-durable-s%C3%A9curis%C3%A9e-et-utile">Axe 4 — Construire une informatique durable, sécurisée et utile</h3>
<p>La <em>confidentialité des données</em>, la <em>conformité</em> et la <em>continuité des activités</em> sont essentielles dans ce secteur.<br />
Ton argument : tu souhaites associer la modernisation du SI à une maîtrise rigoureuse des risques, plutôt que de privilégier l'innovation pour elle-même.</p>
<blockquote>
<p>« Pour moi, la performance d'une DSI repose sur un équilibre entre trois dimensions : la robustesse opérationnelle, la maîtrise des risques et la capacité à accompagner les évolutions du métier. Je souhaite construire une trajectoire qui concilie ces trois dimensions, avec des priorités partagées avec la direction et des résultats mesurables. »</p>
</blockquote>
</section>

<h2 id="4-comment-r%C3%A9pondre-%C3%A0-la-question-%C2%AB-pourquoi-caderas-martin--%C2%BB">4. Comment répondre à la question « Pourquoi Caderas Martin ? »</h2>
<p>Ce qui m'attire chez Caderas Martin, c'est d'abord la combinaison entre un cabinet établi, reconnu pour son expertise et une volonté de faire évoluer ses pratiques et ses outils.</p>
<p>J'ai identifié trois dimensions : la diversité des métiers de l'expertise comptable, de l'audit et du conseil, la dimension internationale de la clientèle et la place importante du numérique dans la qualité du service rendu.</p>
<p>Dans ce contexte, le rôle du DSI est à la fois <strong>stratégique</strong> et <strong>opérationnel</strong> : garantir un système d'information <strong>fiable</strong> et <strong>sécurisé</strong>, tout en faisant <strong>évoluer les applications</strong> et les <strong>processus</strong> pour améliorer l'<strong>efficacité des équipes</strong> et l'<strong>expérience des clients</strong>.</p>
<p>La transformation numérique, la maîtrise des risques et l'accompagnement du changement sont des sujets qui rendent cette fonction particulièrement stimulante.</p>
<p>Enfin, je suis sensible à la dimension humaine d'une structure à taille humaine, où la proximité avec les décideurs et les équipes permet de construire des solutions adaptées aux besoins réels.</p>
<p>C'est cette combinaison entre <strong>enjeux technologiques</strong>, <strong>impact métier</strong> et <strong>proximité humaine</strong> qui motive mon intérêt pour <em>Caderas Martin</em>.</p>

<th><em>Conseil important : cette réponse gagnera en force si tu y ajoutes un exemple précis de ton parcours : une transformation réussie, une amélioration de la disponibilité du SI, une réduction des coûts, un projet de cybersécurité ou une équipe que tu as accompagnée</em></th>
</tr>

<h2 id="5-les-questions-rh-probables-et-la-mani%C3%A8re-dy-r%C3%A9pondre">5. Les questions RH probables et la manière d'y répondre</h2>
<p>L'entreprise indique que son entretien RH porte notamment sur le parcours, le projet professionnel, les valeurs et les motivations du candidat.</p>

<h2 id="6-les-questions-pertinentes-%C3%A0-poser-au-recruteur">6. Les questions pertinentes à poser au recruteur</h2>
<p>Le but n'est pas de présenter un audit informatique dès le premier entretien, mais de montrer que tu réfléchis déjà aux enjeux de la fonction.</p>
<h3 id="sur-le-poste-et-ses-objectifs">Sur le poste et ses objectifs</h3>
<ul>
<li>Quelles sont les raisons qui conduisent le cabinet à recruter aujourd'hui sur cette fonction ?</li>
<li>Quelles seraient les trois priorités attendues du DSI au cours des six à douze premiers mois ?</li>
<li>Quel est le périmètre exact du poste : infrastructure, cybersécurité, applications métiers, data et transformation digitale ?</li>
</ul>
<h3 id="sur-lorganisation-et-la-gouvernance">Sur l'organisation et la gouvernance</h3>
<ul>
<li>À qui le DSI est-il rattaché et comment les décisions informatiques sont-elles arbitrées avec les associés ?</li>
<li>Quelle est la composition de l'équipe informatique et quelle part des services est externalisée ?</li>
<li>Comment les besoins des différents métiers sont-ils recueillis et priorisés ?</li>
</ul>
<h3 id="sur-la-transformation-num%C3%A9rique">Sur la transformation numérique</h3>
<ul>
<li>Où en est le cabinet dans l'évolution de ses outils comptables et de sa stratégie de facturation électronique ?</li>
<li>Quels sont les principaux enjeux actuels en matière de cybersécurité, de continuité d'activité et de gestion des données ?</li>
<li>Quelle place souhaitez-vous donner à l'automatisation, à la data et à l'intelligence artificielle ?</li>
</ul>
<h3 id="sur-la-r%C3%A9ussite-dans-le-poste">Sur la réussite dans le poste</h3>
<ul>
<li>Quels résultats concrets vous permettraient de considérer que le recrutement est une réussite au bout d'un an ?</li>
<li>Quelle autonomie et quels moyens seront donnés au DSI pour conduire les évolutions prioritaires ?</li>
</ul>
</section>

<h2 id="7-ta-vision-des-90-premiers-jours--un-bon-sujet-pour-te-diff%C3%A9rencier">7. Ta vision des 90 premiers jours : un bon sujet pour te différencier</h2>
<h3 id="jours-1%E2%80%9330">Jours 1–30</h3>
<ul>
<li>Comprendre</li>
<li>Écouter et établir le diagnostic</li>
</ul>
<p><img class="emoji" draggable="false" alt="▶️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/25b6.svg" data-marp-twemoji=""/> Rencontrer les associés, les responsables métiers, l'équipe informatique et les prestataires. Comprendre les applications, les contrats, les incidents récurrents, les risques de sécurité, les coûts et les projets en cours.</p>
<h3 id="jours-31%E2%80%9360">Jours 31–60</h3>
<ul>
<li>Prioriser</li>
<li>Définir une feuille de route partagée</li>
</ul>
<p><img class="emoji" draggable="false" alt="▶️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/25b6.svg" data-marp-twemoji=""/> Hiérarchiser les risques et les projets selon leur valeur métier, leur urgence, leur coût et leur faisabilité. Identifier quelques améliorations rapides et définir des indicateurs de performance.</p>
<h3 id="jours-61%E2%80%9390">Jours 61–90</h3>
<ul>
<li>Engager</li>
<li>Lancer les premières actions</li>
</ul>
<p><img class="emoji" draggable="false" alt="▶️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/25b6.svg" data-marp-twemoji=""/> Présenter une feuille de route validée avec la direction, sécuriser les sujets les plus critiques, engager une première amélioration opérationnelle et clarifier la gouvernance des projets.</p>
<p><em>Les indicateurs pourraient inclure la disponibilité des applications critiques, le délai de résolution des incidents, le niveau de couverture des sauvegardes testées, l'avancement des projets prioritaires, la satisfaction des utilisateurs et le coût des services informatiques.</em></p>
</section>

<h2 id="8-point-de-vigilance--clarifier-le-p%C3%A9rim%C3%A8tre-r%C3%A9el-du-poste">8. Point de vigilance : clarifier le périmètre réel du poste</h2>
<p>Le site officiel décrit une fonction informatique existante, avec une responsable informatique, un collaborateur et un associé impliqué dans les sujets stratégiques. Il mentionne aussi un projet de renouvellement de l'outil comptable et de sélection d'une solution de facturation électronique.</p>
<p>En parallèle, le site carrière affiche une offre de Directeur de la Transformation Digitale &amp; Data.</p>
<p>Il serait donc pertinent de déterminer si le recrutement vise :</p>
<ul>
<li>
<p>une prise de responsabilité hiérarchique sur l'informatique existante ;</p>
</li>
<li>
<p>une extension du rôle vers la stratégie, les applications, la data et la transformation ;</p>
</li>
<li>
<p>ou une réorganisation de la gouvernance informatique et numérique.</p>
</li>
</ul>
<p><em>Cette distinction conditionne les compétences à mettre en avant, les questions à poser et la façon de présenter ta vision du poste.</em></p>
<h2 id="9-la-fiche-m%C3%A9mo-%C3%A0-retenir-avant-lentretien">9. La fiche mémo à retenir avant l'entretien</h2>
<p>Caderas Martin en quelques mots : cabinet créé en <strong>1978</strong>, plus de <strong>153 collaborateurs</strong>, plus de 50 % de clientèle internationale, expertise comptable, audit et conseil, culture de proximité et organisation transverse.</p>
<p>Ses enjeux SI les plus visibles : continuité de service, sécurité et confidentialité, cohérence des outils métiers, dématérialisation comptable, facturation électronique et accompagnement des utilisateurs.</p>
<p><img class="emoji" draggable="false" alt="🏍️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3cd.svg" data-marp-twemoji=""/> Ta motivation centrale : faire du SI un levier de qualité, d'efficacité et de confiance, tout en conservant une forte exigence de sécurité et de maîtrise des risques.</p>
<p><img class="emoji" draggable="false" alt="🧮" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ee.svg" data-marp-twemoji=""/> Ton positionnement : un dirigeant qui sait écouter les métiers, arbitrer les investissements, conduire le changement et transformer une stratégie en résultats concrets.</p>
</section>

<h3 id="le-poste">Le poste</h3>
<p>Votre rôle sera à la fois <strong>stratégique</strong>, <strong>opérationnel</strong> et <strong>transverse</strong>.</p>
<p>Vous aurez notamment pour responsabilités de :</p>
<ul>
<li>définir et mettre en œuvre la stratégie de transformation numérique du cabinet et son schéma directeur</li>
<li>accompagner la transformation des métiers de l’expertise comptable, de l’audit et du social</li>
<li>piloter le portefeuille de produits numériques du cabinet et définir leur feuille de route</li>
<li>faire évoluer notre portail clients, nos outils internes et nos services numériques</li>
<li>superviser les projets de développement d’applications internes et externes</li>
<li>identifier et développer les cas d’usage liés à l’intelligence artificielle et à l’automatisation</li>
<li>garantir l'interopérabilité de nos logiciels et la qualité de nos données</li>
<li>définir et piloter la politique de gouvernance et de valorisation des données</li>
<li>piloter les partenaires technologiques, éditeurs, développeurs et prestataires</li>
<li>superviser les enjeux de cybersécurité, en lien avec nos partenaires spécialisés</li>
<li>veiller à la prise en compte des exigences liées au RGPD et à la protection des données dans les projets numériques</li>
<li>accompagner les équipes dans l’évolution de leurs pratiques et favoriser l’adoption des nouveaux outils.</li>
</ul>
</section>

<p>Vous travaillerez en étroite collaboration avec l’ensemble des directions métiers et coordonnerez les différents acteurs internes et externes intervenant sur les projets numériques.</p>
<p>Nous recherchons avant tout un(e) bâtisseur(se), capable de transformer une vision en projets concrets et mesurables.</p>
<p>Issu(e) d’une formation supérieure de type école d’ingénieur, Master, école de commerce avec une spécialisation numérique ou équivalent, vous justifiez d’une expérience confirmée d’au moins 10 ans dans des fonctions de direction de la transformation, direction produit, direction des systèmes d’information ou direction de l’innovation.</p>
<p>Vous avez déjà piloté des projets de <strong>transformation numérique d’envergure</strong> et êtes capable de conjuguer <strong>vision stratégique</strong>, <strong>compréhension technique</strong> et <strong>conduite du changement</strong>.</p>
<p>Vous maîtrisez ou disposez d’une solide culture autour des sujets suivants :</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>* transformation numérique et systèmes d’information ;
* produits et services numériques ;
* intelligence artificielle et automatisation ;
* data et gouvernance des données ;
* développement applicatif ;
* cybersécurité ;
* pilotage de projets complexes et de partenaires.
</code></pre>
<p>Une expérience acquise dans une entreprise de services, un éditeur de logiciels, une ESN ou une entreprise fortement digitalisée sera particulièrement appréciée.</p>
<p>Au-delà de votre expertise, nous recherchons une personnalité capable de fédérer, convaincre et accompagner les équipes, avec une forte capacité à travailler en transversal.</p>
<p>Autonomie pour définir la feuille de route numérique du cabinet<br />
Prioriser les projets et construire progressivement une véritable direction de la transformation.</p>
<p>Vous aurez l’opportunité d’avoir un impact direct et mesurable sur :</p>
<ul>
<li>la productivité et le quotidien de nos équipe</li>
<li>l’automatisation et la simplification de nos processus</li>
<li>l’expérience de nos clients</li>
<li>la qualité et la valorisation de nos données</li>
<li>le développement de nouveaux produits et services numériques</li>
<li>et, plus largement, l’évolution du modèle du cabinet.</li>
</ul>
<p>Un poste au <strong>cœur de notre stratégie</strong> pour faire du numérique, de la <strong>donnée</strong> et de l’<strong>IA</strong> des leviers durables de <strong>différenciation</strong> et de <strong>création de valeur</strong>.</p>
</section>

<p><u>Les questions à préparer :</u></p>
<ol>
<li>
<p><strong>« Quelle serait votre priorité durant vos 100 premiers jours ? »</strong></p>
</li>
<li>
<p><strong>« Comment construisez-vous une stratégie SI lorsque vous arrivez dans une organisation que vous ne connaissez pas ? »</strong></p>
</li>
<li>
<p><strong>« Comment arbitrez-vous entre maintien en condition opérationnelle, dette technique et nouveaux projets ? »</strong></p>
</li>
<li>
<p><strong>« Quelle est votre approche de la cybersécurité ? »</strong></p>
</li>
<li>
<p><strong>« Que feriez-vous avec l'IA ? »</strong></p>
</li>
<li>
<p><strong>« Comment faites-vous travailler la DSI avec les métiers ? »</strong></p>
</li>
<li>
<p><strong>« Comment managez-vous une équipe de 15 à 20 personnes ? »</strong></p>
</li>
<li>
<p><strong>« Comment gérez-vous les prestataires et l'externalisation ? »</strong></p>
</li>
<li>
<p><strong>« Comment mesurez-vous la performance d'une DSI ? »</strong></p>
</li>
<li>
<p><strong>« Quelle relation souhaitez-vous avoir avec le DG et les membres du CODIR ? »</strong></p>
</li>
</ol>
<p><img class="emoji" draggable="false" alt="♾️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/267e.svg" data-marp-twemoji=""/> Ce qui me donne envie de rejoindre =&gt; c’est d’abord la combinaison entre une <strong>mission qui a du sens</strong>  et un véritable <strong>enjeu de transformation</strong>.</p>
<p><img class="emoji" draggable="false" alt="☕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2615.svg" data-marp-twemoji=""/> Je trouve particulièrement intéressant que le système d’information soit aussi directement <strong>connecté au cœur de métier de ...</strong> : la gestion des droits, la relation avec les clients, la donnée et les nouveaux enjeux liés notamment à l’intelligence artificielle. Cela donne au DSI une responsabilité qui va bien au-delà du fonctionnement de l’IT.</p>
<p>Le deuxième élément qui m’attire beaucoup, c’est la dimension stratégique du poste. Le rattachement à la Direction Générale et la participation au comité de direction montrent que la DSI doit être un partenaire des métiers et contribuer aux choix structurants de l’organisation. C’est exactement la dimension que je recherche aujourd’hui : être capable à la fois de garantir un SI robuste et sécurisé et d’utiliser le numérique comme un levier de transformation et de création de valeur.</p>
<p>Enfin, la <strong>taille de la structure et de l’équipe</strong> ainsi que l’étendue du périmètre me plaisent beaucoup. Il y a à la fois un enjeu de <strong>stratégie</strong>, de <strong>transformation technologique</strong>, de <strong>cybersécurité</strong>, de <strong>data</strong> et d’<strong>IA</strong>, mais aussi un véritable <strong>enjeu humain et managérial</strong>.</p>
<p>C’est donc un poste qui me paraît particulièrement complet, avec une vraie capacité d’impact. Et c’est précisément ce que je recherche : rejoindre une organisation dont la mission m’intéresse, comprendre ses enjeux, construire une trajectoire SI pragmatique et embarquer les équipes et les métiers dans cette transformation.</p>
</section>

<h2 id="1-%C2%AB-quelle-serait-votre-priorit%C3%A9-durant-vos-100-premiers-jours--%C2%BB">1. « Quelle serait votre priorité durant vos 100 premiers jours ? »</h2>
<blockquote>
<p>« Ma priorité ne serait pas d'arriver avec un plan de transformation déjà écrit. Les 100 premiers jours seraient d'abord consacrés à comprendre, écouter et établir un diagnostic partagé.</p>
<p>Je travaillerais sur <strong>quatre dimensions</strong> : les enjeux stratégiques, la perception de la DSI par les métiers, la robustesse du SI et les risques — notamment cyber, opérationnels et liés aux dépendances technologiques.</p>
<p>Je rencontrerais individuellement les membres du CODIR et les principaux responsables métiers, mais aussi l'équipe DSI. Je chercherais à comprendre ce qui fonctionne bien, ce qui fait perdre du temps, les irritants majeurs et surtout les sujets sur lesquels l'entreprise prend aujourd'hui un risque.</p>
<p>À l'issue de cette phase, je voudrais être capable de présenter trois choses au DG et au CODIR : une photographie objective de la situation, les quelques priorités réellement structurantes et une trajectoire à 2 ou 3 ans, avec des premières actions visibles à court terme.</p>
<p>Mon objectif au bout de 100 jours serait donc moins d'avoir lancé beaucoup de projets que d'avoir créé de la <strong>clarté</strong>, de la <strong>confiance</strong> et un <strong>alignement sur les priorités</strong>. »</p>
</blockquote>
<h3 id="message-implicite">Message implicite</h3>
<blockquote>
<p>« Je ne suis ni un pompier, ni un DSI qui arrive avec des certitudes. Je prends le temps de comprendre avant d'engager l'organisation. »</p>
</blockquote>
</section>

<h1 id="2-%C2%AB-comment-construisez-vous-une-strat%C3%A9gie-si-lorsque-vous-arrivez-dans-une-organisation-que-vous-ne-connaissez-pas--%C2%BB">2. « Comment construisez-vous une stratégie SI lorsque vous arrivez dans une organisation que vous ne connaissez pas ? »</h1>
<blockquote>
<p>« Je pars toujours de la <strong>stratégie de l'entreprise</strong>, et non de la technologie.</p>
<p>Je cherche d'abord à comprendre où l'organisation veut être dans trois à cinq ans, quels sont ses enjeux de développement, ses contraintes réglementaires, ses risques et ses transformations métiers.</p>
<p>Ensuite, je fais le lien avec le SI : quelles capacités technologiques sont nécessaires pour accompagner cette ambition ? Où sont les écarts entre la situation actuelle et la cible ?</p>
<p>Je regarde alors le portefeuille applicatif, l'architecture, la data, les infrastructures, la cybersécurité, les compétences internes et les dépendances externes.</p>
<p>À partir de là, je construis une trajectoire qui distingue clairement ce qui est indispensable, ce qui crée de la valeur et ce qui peut attendre.</p>
<p>Une bonne stratégie SI, pour moi, n'est donc pas un catalogue de projets technologiques. C'est un choix assumé de priorités, d'investissements et de risques, aligné sur la stratégie de l'entreprise. »</p>
</blockquote>
<h3 id="phrase-forte">Phrase forte</h3>
<blockquote>
<p><strong>« La stratégie SI doit être la traduction technologique de la stratégie de l'entreprise, pas l'inverse. »</strong></p>
</blockquote>
</section>

<h1 id="3-%C2%AB-comment-arbitrez-vous-entre-maintien-en-condition-op%C3%A9rationnelle-dette-technique-et-nouveaux-projets--%C2%BB">3. « Comment arbitrez-vous entre maintien en condition opérationnelle, dette technique et nouveaux projets ? »</h1>
<blockquote>
<p>« Je ne considère pas ces trois dimensions comme concurrentes par principe. Le premier rôle de la DSI est de garantir la continuité et la sécurité du SI ; le deuxième est de réduire progressivement les risques et la dette ; le troisième est d'accompagner la transformation.</p>
<p>Je raisonne donc en portefeuille et en capacité d'investissement.</p>
<p>Je commence par sécuriser ce qui est critique : disponibilité, cybersécurité, obsolescence présentant un risque important, dépendances à des fournisseurs ou à des personnes clés.</p>
<p>Ensuite, je mets en évidence le coût de la dette technique : coût financier, risques opérationnels, frein à l'évolution et complexité.</p>
<p>Enfin, je priorise les nouveaux projets selon leur valeur métier, leur urgence stratégique et leur niveau de risque.</p>
<p>Et surtout, je rends les arbitrages explicites au CODIR. Je préfère dire : &quot;voici ce que nous pouvons faire, voici ce que nous ne pouvons pas faire et voici le risque associé&quot;, plutôt que de laisser la DSI accumuler des engagements qu'elle ne pourra pas tenir. »</p>
</blockquote>
<blockquote>
<p><strong>« Mon rôle de DSI est aussi de dire non, mais surtout d'expliquer pourquoi et de proposer une alternative. »</strong></p>
</blockquote>
</section>

<h1 id="4-%C2%AB-quelle-est-votre-approche-de-la-cybers%C3%A9curit%C3%A9--%C2%BB">4. « Quelle est votre approche de la cybersécurité ? »</h1>
<blockquote>
<p>« Je considère la cybersécurité d'abord comme un sujet de risque d'entreprise, et pas uniquement comme un sujet technique.</p>
<p>Ma première question serait donc : quels sont les actifs critiques ? quelles seraient les conséquences d'une compromission ou d'une indisponibilité, et quels sont les scénarios de risque les plus importants ?</p>
<p>Je travaillerais ensuite sur les fondamentaux : identité et habilitations, protection des données, sauvegardes et capacité de restauration, gestion des vulnérabilités, supervision, sécurité des prestataires, sensibilisation des collaborateurs et surtout capacité de réaction et de continuité d'activité.</p>
<p>Je veux également que la cybersécurité soit intégrée aux projets dès leur conception, notamment sur les sujets data et IA.</p>
<p>Enfin, je considère qu'une bonne politique cyber doit être pilotée avec le CODIR. Le comité de direction doit connaître les risques majeurs, le niveau de protection et les décisions qui nécessitent un arbitrage.</p>
<p>Mon objectif n'est pas d'avoir un SI &quot;zéro risque&quot; — cela n'existe pas — mais d'avoir un niveau de risque connu, maîtrisé et accepté au bon niveau de gouvernance. »</p>
</blockquote>
<h3 id="phrase-%C3%A0-retenir">Phrase à retenir</h3>
<blockquote>
<p><strong>« La cybersécurité est une décision de risque d'entreprise avant d'être une décision technologique. »</strong></p>
</blockquote>
</section>

<h1 id="5-%C2%AB-que-feriez-vous-avec-lia--%C2%BB">5. « Que feriez-vous avec l'IA ? »</h1>
<blockquote>
<p>« Je commencerais par ne pas considérer l'IA comme une fin en soi.</p>
<p>Je chercherais d'abord les cas d'usage qui peuvent réellement améliorer l'expérience des collaborateurs et des clients, l'efficacité des collaborateurs ou la qualité des processus.</p>
<p>Je regarderais notamment trois catégories : l'amélioration de la relation avec les collaborateurs ou les clients, l'optimisation des processus internes et l'exploitation de la donnée pour améliorer la connaissance et la qualité de service.</p>
<p>Mais compte tenu des missions : une quatrième dimension essentielle : l'IA doit également être regardée sous l'angle de la protection des données clients et de la gouvernance des données.</p>
<p>Je mettrais donc en place une approche très pragmatique : quelques cas d'usage à forte valeur, un cadre de gouvernance, des règles sur les données et la confidentialité, puis une mesure objective des bénéfices.</p>
<p>Je préfère avoir trois cas d'usage IA qui créent réellement de la valeur et qui sont maîtrisés plutôt que quinze expérimentations qui ne passent jamais à l'échelle. »</p>
</blockquote>
<h3 id="et-si-le-dg-insiste">Et si le DG insiste :</h3>
<p><strong>« Quel premier cas d'usage ? »</strong></p>
<blockquote>
<p>« Je ne choisirais pas le premier cas d'usage avant d'avoir rencontré les métiers et analysé les données disponibles. Mais je chercherais prioritairement un cas où l'IA peut réduire une charge opérationnelle importante ou améliorer sensiblement le service rendu aux clients, tout en ayant un niveau de risque maîtrisable. »</p>
</blockquote>
</section>

<h1 id="6-%C2%AB-comment-faites-vous-travailler-la-dsi-avec-les-m%C3%A9tiers--%C2%BB">6. « Comment faites-vous travailler la DSI avec les métiers ? »</h1>
<blockquote>
<p>« Pour moi, la relation DSI-métiers ne doit pas être une relation de client à fournisseur interne. La DSI doit être un partenaire de transformation.</p>
<p>Cela commence par une gouvernance claire : qui décide, qui priorise et selon quels critères.</p>
<p>Je veux que les métiers expriment d'abord leurs <strong>besoins</strong> et leurs <strong>enjeux</strong>, plutôt que de demander directement des solutions technologiques. La DSI apporte ensuite son expertise pour construire la réponse.</p>
<p>Je mets également en place une <strong>gouvernance portefeuille des projets</strong> permettant au CODIR de visualiser les projets, les coûts, les capacités disponibles, les dépendances et les arbitrages.</p>
<p>Enfin, je suis très attentif à la qualité de la relation au quotidien et au sens du service. Une DSI peut avoir une excellente architecture et être perçue comme mauvaise si elle est difficile à solliciter, trop lente ou trop éloignée des métiers.</p>
<p>Mon objectif est donc de faire évoluer la perception de la DSI : passer de &quot;ceux qui gèrent l'informatique&quot; à &quot;ceux qui nous aident à transformer l'entreprise&quot;. »</p>
</blockquote>
<blockquote>
<p><strong>« Je veux que les métiers viennent voir la DSI avant d'avoir défini la solution, pas après. »</strong></p>
</blockquote>
</section>

<h1 id="7-%C2%AB-comment-managez-vous-une-%C3%A9quipe-de-15-%C3%A0-20-personnes--%C2%BB">7. « Comment managez-vous une équipe de 15 à 20 personnes ? »</h1>
<blockquote>
<p>« À cette taille d'équipe, mon rôle n'est pas d'être le meilleur expert technique. Mon rôle est de créer les conditions permettant à l'équipe de réussir.</p>
<p>Je commence par clarifier l'organisation, les responsabilités et les objectifs. Je veux que chacun sache ce dont il est responsable, mais aussi pourquoi son activité contribue aux objectifs de l'entreprise.</p>
<p>Je suis très attentif à la qualité du management de proximité, au développement des compétences et à la capacité des managers ou responsables de domaine à prendre des décisions.</p>
<p>Je cherche également à identifier les dépendances excessives à certaines personnes clés et à construire progressivement de la résilience dans l'organisation.</p>
<p>Enfin, j'aime donner de l'autonomie tout en maintenant un niveau d'exigence élevé sur les engagements, la qualité de service et la transparence.</p>
<p>Mon principe est simple : je veux une équipe qui soit capable de fonctionner efficacement sans que tout remonte au DSI. »</p>
</blockquote>
<blockquote>
<p><strong>« Mon ambition n'est pas d'être le centre de décision de la DSI, mais de construire une DSI qui sait décider. »</strong></p>
</blockquote>
</section>

<h1 id="8-%C2%AB-comment-g%C3%A9rez-vous-les-prestataires-et-lexternalisation--%C2%BB">8. « Comment gérez-vous les prestataires et l'externalisation ? »</h1>
<blockquote>
<p>« Je ne suis ni pour l'internalisation systématique ni pour l'externalisation systématique. Je cherche à déterminer quelles compétences doivent rester stratégiquement maîtrisées en interne et lesquelles peuvent être confiées à des partenaires.</p>
<p>Je porte une attention particulière aux sujets où l'organisation pourrait devenir dépendante d'un fournisseur : connaissance du SI, données, architecture, compétences critiques ou capacité à changer de prestataire.</p>
<p>Je veux également que les contrats soient pilotés par la valeur et la performance, pas uniquement par des engagements de moyens.</p>
<p>Cela suppose des SLA pertinents, des indicateurs, une gouvernance fournisseur et surtout une capacité interne suffisante pour challenger le prestataire.</p>
<p>Je considère qu'externaliser une activité ne signifie pas externaliser la responsabilité. Le DSI reste responsable du résultat vis-à-vis de l'entreprise. »</p>
</blockquote>
<blockquote>
<p><strong>« Je peux externaliser l'exécution ; je ne dois jamais externaliser la maîtrise. »</strong></p>
</blockquote>
</section>

<h1 id="9-%C2%AB-comment-mesurez-vous-la-performance-dune-dsi--%C2%BB">9. « Comment mesurez-vous la performance d'une DSI ? »</h1>
<blockquote>
<p>« Je mesure une DSI sur quatre dimensions : <strong>fiabilité</strong>, <strong>sécurité</strong>, <strong>valeur</strong> et <strong>capacité de transformation</strong>.</p>
<p>Sur la fiabilité : disponibilité des services critiques, incidents, qualité de service et respect des engagements.</p>
<p>Sur la sécurité : niveau de risque, vulnérabilités critiques, incidents, résilience et capacité de restauration.</p>
<p>Sur la valeur : respect des budgets, bénéfices des projets, satisfaction des métiers et contribution aux objectifs de l'entreprise.</p>
<p>Et enfin sur la transformation : capacité à délivrer les projets prioritaires, réduction de la dette technique, évolution de l'architecture et capacité à faire évoluer rapidement le SI.</p>
<p>Je veux surtout éviter de mesurer la performance d'une DSI uniquement à son respect du budget. Une DSI qui respecte son budget mais empêche l'entreprise de se transformer n'est pas une DSI performante.</p>
<p>Les indicateurs doivent donc être compréhensibles par le CODIR et permettre de prendre des décisions. »</p>
</blockquote>
<blockquote>
<p><strong>« Un KPI de DSI n'a de valeur que s'il permet de prendre une décision. »</strong></p>
</blockquote>
</section>

<h1 id="10-%C2%AB-quelle-relation-souhaitez-vous-avoir-avec-le-dg-et-les-membres-du-codir--%C2%BB">10. « Quelle relation souhaitez-vous avoir avec le DG et les membres du CODIR ? »</h1>
<blockquote>
<p>« Je souhaite avoir avec le DG une relation de confiance, de transparence et de challenge réciproque.</p>
<p>Mon rôle n'est pas de remonter au DG tous les problèmes de la DSI. Mon rôle est de lui donner une vision claire de la situation, des risques, des options et des décisions qui nécessitent son arbitrage.</p>
<p>Je veux être capable de lui dire quand tout va bien, mais surtout quand quelque chose ne va pas. Et lorsque je remonte un problème, je veux arriver avec une analyse et plusieurs options, avec leurs conséquences en termes de coût, de délai, de risque et de valeur.</p>
<p>Avec le CODIR, je souhaite être un partenaire des métiers. Je ne veux pas être le &quot;DSI qui défend son budget&quot; mais celui qui contribue aux arbitrages globaux de l'entreprise.</p>
<p>Et j'attends également du CODIR qu'il considère le SI comme une responsabilité collective : la transformation numérique ne peut pas être portée par la DSI seule.</p>
<p>Pour moi, la bonne relation avec le DG repose finalement sur trois choses : pas de surprise, des arbitrages explicites et une confiance fondée sur la transparence. »</p>
</blockquote>
<blockquote>
<p><strong>« Je ne veux pas que le DG découvre un problème informatique ; je veux qu'il découvre avec moi un risque d'entreprise que nous avons choisi de traiter. »</strong></p>
</blockquote>
</section>

<h1 id="les-5-messages-cl%C3%A9">Les 5 messages clé</h1>
<ol>
<li>
<p><strong>Je pars du business, pas de la technologie.</strong></p>
</li>
<li>
<p><strong>Je sais arbitrer entre risque, coût, valeur et capacité.</strong></p>
</li>
<li>
<p><strong>Je considère la cybersécurité et la data comme des sujets de gouvernance d'entreprise.</strong></p>
</li>
<li>
<p><strong>Je construis une DSI autonome, responsabilisée et proche des métiers.</strong></p>
</li>
<li>
<p><strong>Je suis un partenaire du DG et du CODIR, pas simplement le responsable de l'informatique.</strong></p>
</li>
</ol>
<p>Le contexte appelle selon moi un <strong>management responsabilisant, fédérateur et assez structurant</strong>, avec une forte capacité d’arbitrage.</p>
<p>Environnement où <strong>l'écoute et la pédagogie</strong> sont importantes, mais où la <strong>clarté des responsabilités et des décisions</strong> l'est tout autant.</p>
</section>

<h2 id="le-mod%C3%A8le-que-je-privil%C3%A9gierais--%C2%AB-cadre-clair--autonomie--exigence-%C2%BB">Le modèle que je privilégierais : « cadre clair + autonomie + exigence »</h2>
<p>Management autour de <strong>4 piliers</strong>.</p>
<h3 id="1-donner-du-sens">1. Donner du sens</h3>
<p>Le premier rôle du DSI serait de donner une direction à l'équipe.</p>
<blockquote>
<p>« Nous devons construire un SI fiable, sécurisé et évolutif qui permet de mieux servir les clients, les collaborateurs et d'accompagner sa transformation. »</p>
</blockquote>
<p><strong>Le management doit donc reconnecter régulièrement le travail de la DSI à cette mission.</strong></p>
<h3 id="2-responsabiliser-fortement-les-managers-et-r%C3%A9f%C3%A9rents">2. Responsabiliser fortement les managers et référents</h3>
<p>Je déconseille un management où tout remonte au DSI =&gt; des responsables clairement identifiés sur quelques grands domaines :</p>
<ul>
<li>Run / infrastructure / production</li>
<li>Applications et projets</li>
<li>Data / IA</li>
<li>Cybersécurité</li>
<li>éventuellement architecture / urbanisation selon l'organisation</li>
</ul>
<p>Le DSI fixe le <strong>cadre</strong>, les <strong>objectifs</strong> et les <strong>priorités</strong>.</p>
<blockquote>
<p>« Je donne de l'autonomie sur le comment, mais je garde la responsabilité du pourquoi, du quoi et des arbitrages. »</p>
</blockquote>
</section>

<h3 id="3-%C3%AAtre-tr%C3%A8s-exigeant-sur-la-transparence">3. Être très exigeant sur la transparence</h3>
<p>Je voudrais instaurer une culture où :</p>
<ul>
<li>les problèmes sont remontés tôt ;</li>
<li>les risques sont explicités ;</li>
<li>les engagements sont tenus ;</li>
<li>lorsqu'ils ne peuvent pas l'être, on prévient rapidement ;</li>
<li>les décisions sont documentées ;</li>
<li>les responsabilités sont claires.</li>
</ul>
<p>C'est une culture particulièrement adaptée à une DSI qui doit gérer simultanément <strong>run, cyber, dette technique et transformation</strong>.</p>
<h3 id="4-%C3%AAtre-participatif-sur-les-solutions-directif-sur-les-priorit%C3%A9s">4. Être participatif sur les solutions, directif sur les priorités</h3>
<blockquote>
<p><strong>« Je suis participatif dans la construction des solutions, mais je suis clair et assumé dans les décisions. »</strong></p>
</blockquote>
<p><strong>Sur un choix d'architecture :</strong><br />
→ écouter les experts, challenger, faire émerger les options.</p>
<p><strong>Sur la priorité d'un projet :</strong><br />
→ écouter les métiers et la DSI, mais finalement arbitrer.</p>
<p><strong>Sur la cybersécurité :</strong><br />
→ consulter les équipes, mais ne pas négocier avec le risque critique.</p>
<p><strong>Sur l'organisation de l'équipe :</strong><br />
→ construire avec les collaborateurs, mais décider lorsqu'une organisation ne fonctionne pas.</p>
</section>

<h1 id="le-management-que-je-pr%C3%A9senterais-au-dg">Le management que je présenterais au DG</h1>
<p><strong>« Quel est votre style de management ? »</strong></p>
<p>Il repose sur <strong>trois principes</strong> : le <strong>sens</strong>, la <strong>responsabilisation</strong> et l'<strong>exigence</strong>.</p>
<p>Je considère que mon rôle de DSI n'est pas de prendre toutes les décisions à la place de l'équipe, mais de créer les conditions pour que <strong>chacun puisse prendre les bonnes décisions dans son périmètre.</strong></p>
<p>Je donne donc beaucoup d'<strong>autonomie sur le « comment »</strong>, tout en étant très <strong>clair sur les objectifs, les priorités et les résultats attendus.</strong></p>
<p>Je suis également très attaché à la <strong>transparence</strong>. Je préfère qu'un problème soit remonté tôt, même s'il n'est pas encore résolu, plutôt que de découvrir trop tard qu'un sujet dérive. Pour moi, il doit être possible de dire qu'on rencontre une difficulté, à condition d'arriver avec une analyse et, si possible, des options.</p>
<p>Enfin, je suis participatif dans la construction, mais je sais arbitrer. Je ne recherche pas le consensus à tout prix. Sur les sujets structurants, mon rôle est précisément de prendre la responsabilité de la décision et d'en assumer les conséquences.</p>
<p>Avec une équipe de 15 à 20 personnes, mon ambition serait de construire une DSI responsabilisée, avec des leaders sur leurs domaines, qui fonctionne sans que tout remonte au DSI, tout en restant alignée sur une stratégie et des priorités communes.</p>
</section>

<h2 id="dimension--management-du-changement">Dimension =&gt; management du changement</h2>
<p>Le  DSI doit  savoir <strong>expliquer, convaincre et créer de l'adhésion</strong>, pas simplement décider.</p>
<p><u>Posture :</u></p>
<p><strong>Écouter → comprendre → expliquer → proposer → arbitrer → embarquer → mesurer.</strong></p>
<br />
<h1 id="conclusion">Conclusion</h1>
<p><strong>« Je vais prendre la responsabilité de la DSI pour vous libérer, pas vous donner davantage de problèmes à gérer. »</strong></p>
<h3 id="une-formule-%C3%A0-placer">Une formule à placer</h3>
<blockquote>
<p><strong>« Mon objectif à terme serait que le DG puisse avoir confiance dans la DSI sans avoir besoin de la contrôler au quotidien. Il doit savoir que les sujets sont maîtrisés, que les risques sont remontés au bon niveau et que les arbitrages lui sont présentés lorsqu'ils relèvent réellement du CODIR. »</strong></p>
</blockquote>
<p><strong>Posture à viser pour ce poste</strong> :<br />
DSI <em>fédérateur avec ses équipes,<br />
partenaire avec les métiers,<br />
transparent avec le DG et ferme sur les décisions qui relèvent de sa responsabilité.</em></p>
