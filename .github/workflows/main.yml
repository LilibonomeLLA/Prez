name: Deploy Marp Presentation
on:
  push:
    branches: [ main ] # Ajustez en 'master' si votre branche s'appelle master
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create build folder
        run: mkdir build

      - name: Marp Build (HTML)
        uses: KoharaKazuya/marp-cli-action@v4
        with:
          args: Diaporama.md -o build/index.html

      - name: Marp Build (PDF)
        uses: KoharaKazuya/marp-cli-action@v4
        with:
          args: Diaporama.md -o build/presentation.pdf

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
