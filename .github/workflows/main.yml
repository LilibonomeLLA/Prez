name: Deploy Marp Presentation
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Marp CLI & Pandoc
        run: |
          npm install -g @marp-team/marp-cli
          sudo apt-get update && sudo apt-get install -y pandoc

      - name: Create build folder
        run: mkdir -p build

      - name: Compile ALL Marp Presentations (HTML & PDF)
        run: |
          marp --html --input-dir . --output build --ignore README.md
          marp --pdf --input-dir . --output build --ignore README.md

      - name: Convert README to beautiful HTML page
        run: |
          # Pandoc convertit le Markdown en HTML propre et l'intègre dans le dossier final
          pandoc README.md -f markdown -t html -o build/index.html
